<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Top Up Mobile Legends</title>
    <!-- Internal CSS -->
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            text-align: center;
            font-size: 18px; /* Ukuran font diperbesar */
        }

        .box {
            background-color: #2a2a2a;
            border: 2px solid #444;
            width: 500px; /* Ukuran kotak lebih lebar */
            margin: 15px auto;
            padding: 20px;
        }

        h2 {
            font-size: 24px;
            margin: 5px 0;
        }

        input {
            width: 180px;
            padding: 10px;
            font-size: 16px;
            text-align: center;
        }

        button {
            background-color: orange;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Top Up Mobile Legends</h2>
    </div>

    <div class="box">
        <p><b>1. Masukkan ID</b></p>
        <input type="text" placeholder="User ID">
        <input type="text" placeholder="Zone ID">
    </div>

    <div class="box">
        <p><b>2. Pilih Nominal</b></p>
        <!-- Inline CSS -->
        <p style="border: 2px solid gray; padding: 12px;">5 Diamond - Rp 1.500</p>
        <p style="border: 2px solid orange; color: orange; padding: 12px; font-weight: bold;">50 Diamond - Rp 14.000</p>
        <p style="border: 2px solid gray; padding: 12px;">250 Diamond - Rp 75.000</p>
    </div>

    <div class="box">
        <button>Beli Sekarang</button>
    </div>

</body>
</html>
